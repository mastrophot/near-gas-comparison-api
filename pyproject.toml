[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "near-gas-comparison-api"
version = "0.1.0"
description = "FastAPI service for real-time NEAR vs Ethereum gas cost comparison"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Mastrophot", email = "butrikmax@gmail.com" }
]
keywords = ["near", "ethereum", "gas", "fastapi", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers"
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1"
]

[project.scripts]
near-gas-compare-api = "near_gas_compare.main:cli"

[project.urls]
Homepage = "https://github.com/mastrophot/near-gas-comparison-api"
Repository = "https://github.com/mastrophot/near-gas-comparison-api"
Issues = "https://github.com/mastrophot/near-gas-comparison-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/near_gas_compare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
